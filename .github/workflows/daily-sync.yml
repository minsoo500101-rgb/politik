name: Daily data sync

on:
  schedule:
    # 매일 오전 9시 KST (= UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: {} # 수동 트리거 허용

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 위키 자동 career 보충 (career 미보유 인사만)
        run: |
          # 모든 type에 대해 limit 30씩 시도 (rate limit 보호)
          for t in local_gov_muni committee_secretary vice_minister former_pm former_local edu_superintendent agency_head local_council_speaker; do
            node scripts/wiki-auto-career.js --write --type=$t --limit=30 || true
          done

      # 22대 의원 명부는 재보궐·궐위·탈당으로 바뀐다. 어떤 크론도 이 파일을 갱신하지 않아
      # 2026-05-28 시점 286명에 3개월 반 묶여 있었고(6·3 재보궐 당선 14명 누락) 사이트 표기·
      # 분석 기사 통계까지 함께 틀려 있었다. 실패해도 나머지 동기화는 진행한다.
      - name: 22대 국회 명부 동기화 (국회 OPEN API)
        run: node scripts/fetch-assembly-22.js || echo "::warning::fetch-assembly-22.js 실패 — 기존 명부 유지"

      # <title>·description·og:*·소개 카드의 "22대 통과 법안 N건"은 손으로 박은 값이라
      # 화면(국회 API 라이브)과 따로 논다. 2026-09-21 점검에서 화면 1,847 vs 표기 1,595로
      # 252건(-13.6%) 뒤처져 있었고, 그 문장이 그대로 검색결과에 노출되고 있었다.
      - name: 법안 건수 표기 동기화 (국회 OPEN API)
        run: node scripts/sync-bill-count.js --write || echo "::warning::sync-bill-count.js 실패 — 기존 표기 유지"

      - name: V28.0 — llms.txt/llms-full.txt 자동 동기화
        run: node scripts/update-llms.js

      - name: V28.0 — 사이트 표기 ↔ 실제 데이터 검증
        run: node scripts/verify-counts.js || echo "::warning::verify-counts.js 발견된 stale 있음 (수동 확인)"

      - name: 변경사항 확인
        id: check
        run: |
          if git diff --quiet data/politicians.json data/assembly-22.json index.html llms.txt llms-full.txt; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # ⚠ 이 스텝은 반드시 '검증'보다 앞에 있어야 한다.
      # wiki-auto-career.js가 쓰기를 하면 politicians.json의 version이 +1 된다.
      # 이 치환이 validate.js 뒤로 가면 매 실행이 'version=N vs POLITICIANS_VER=N-1'로 검증 실패 →
      # 커밋 스텝에 도달하지 못해 데이터가 영원히 반영되지 않는다 (2026-09-12~17 6일간 실제 발생).
      - name: POLITICIANS_VER 동기화 (검증보다 먼저)
        id: ver
        if: steps.check.outputs.changed == 'true'
        run: |
          NEW_VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/politicians.json','utf8')).version)")
          sed -i "s|const POLITICIANS_VER = [0-9]*;|const POLITICIANS_VER = ${NEW_VER};|" index.html
          # prefetch <link>의 고정 숫자만 바꾼다. 예전 패턴 'politicians.json?v=[0-9]*'는 [0-9]*가 빈 문자열에도
          # 걸려 fetch 코드 '?v=' + POLITICIANS_VER 를 매일 '?v=NN' + … 로 되돌려 ?v=NNNN 중복 다운로드를 재발시켰다.
          sed -i "s|href=\"/data/politicians.json?v=[0-9]\+\"|href=\"/data/politicians.json?v=${NEW_VER}\"|" index.html
          echo "ver=${NEW_VER}" >> $GITHUB_OUTPUT

      - name: 검증
        if: steps.check.outputs.changed == 'true'
        run: node scripts/validate.js

      - name: 커밋·푸시
        if: steps.check.outputs.changed == 'true'
        run: |
          NEW_VER="${{ steps.ver.outputs.ver }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/politicians.json data/assembly-22.json index.html llms.txt llms-full.txt
          git commit -m "chore(data): 국회 명부·위키 career 보충 + llms 동기화 (cron) — v${NEW_VER}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break || (echo "재시도 $i"; sleep 5)
          done
