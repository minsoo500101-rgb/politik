name: law-singu
# 법령 신구표 자동 캐시: GHA(law.go.kr 도달 가능)에서 받아 data/law/*.json 커밋 → patchkr 서빙
on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST (21:00 UTC)
  workflow_dispatch: {}
concurrency:
  group: law-singu
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 신구표 수집
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          LAW_REFERER: https://patchkr.com
          BODY_BUDGET: '6000'   # 본문 백필/run (시행일 최신순). 전체 법×2025+ 일괄 백필용; 완비 후엔 미캐시만 받으므로 빠르게 no-op
          LAW_EF_FROM: '20250101'  # eflaw로 이 시행일 이후 모든 개정(과거 포함) 누적
        run: node scripts/fetch-law-singu.mjs

      # 곧 시행 레이더(/law-radar.html)가 쓰는 경량 색인.
      # data/law/index.json 은 2.3MB라 브라우저가 통째로 받을 수 없어, 시행 전 법령만 추리고
      # 업무 분야 태그와 개정 조문 제목을 붙인 radar.json 을 따로 만든다.
      # 신구표가 갱신되면 반드시 같이 다시 만들어야 D-day가 어긋나지 않는다.
      - name: 곧 시행 레이더 색인 생성
        run: node scripts/build-law-radar.js

      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/law
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "🤖 법령 신구표 자동 갱신 ($(date -u +%Y-%m-%d))"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi
