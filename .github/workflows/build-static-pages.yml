name: Build Static SEO Pages

on:
  push:
    branches: [main]
    paths:
      - 'build_static_pages.py'
      - 'build_sitemap.py'
      - 'data/**'
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 KST — 봇 커밋은 워크플로 트리거 안 하므로 스케줄로 정적페이지·사이트맵 갱신
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate static SEO pages + law pages + sitemaps
        run: |
          python build_static_pages.py
          python build_law_pages.py
          python build_law_hot.py
          python build_risk.py
          python build_sitemap.py
          # 생성기는 스타일을 인라인으로 쓴다 — 공통 블록은 assets/css/ 로 빼서 링크로 바꾼다(UI 개편 1단계).
          # 이 단계가 빠지면 법령 4,930쪽에 같은 CSS가 다시 각각 들어간다.
          node scripts/extract-css.js
          # 공통 HUD 테마(assets/hud.css·글꼴·어두운 기본 테마)를 모든 HTML 에 — 생성기는 이 블록을 모른다(UI 개편 2단계)
          node scripts/apply-hud.js

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A *.html sitemap.xml sitemap-law.xml law/ assets/css/ assets/app.css
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate static SEO pages [skip ci]"
            # 세 번 다 실패하면 스텝을 실패시킨다 — 예전 루프는 마지막 sleep 이 성공이라 실패를 삼켰다
            # (law-singu 가 9/19~9/25 매일 푸시 실패했는데 전부 초록불이었다).
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then PUSHED=1; break; fi
              echo "재시도 $i"; sleep 5
            done
            if [ "$PUSHED" != "1" ]; then echo "::error::git push 3회 실패 — 이 실행의 커밋은 반영되지 않았다"; exit 1; fi
          fi
